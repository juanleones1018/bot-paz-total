name: Bot Paz Total

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Ejecutar bot
        run: python bot_paz_total.py
        env:
          EMAIL_ORIGEN: ${{ secrets.EMAIL_ORIGEN }}
          CLAVE_APP: ${{ secrets.CLAVE_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
