name: Bot Paz Total

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot
        run: python bot_paz_total.py
        env:
          EMAIL_ORIGEN: ${{ secrets.EMAIL_ORIGEN }}
          CLAVE_APP: ${{ secrets.CLAVE_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}

      - name: Guardar historial
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add . || echo "Nada que agregar"
          git commit -m "Actualizar historial automático" || echo "Sin cambios"
          git push
